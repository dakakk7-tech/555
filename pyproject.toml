[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "funpay-manager"
version = "0.2.0"
description = "Professional FunPay Manager — Web API, Desktop Client, Auto Backup"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "Flask==2.3.0",
    "Flask-SQLAlchemy==3.0.0",
    "Flask-CORS==4.0.0",
    "Flask-Limiter==3.3.0",
    "requests>=2.28.0",
    "APScheduler==3.10.0",
    "python-dotenv==1.0.0"
]

[project.scripts]
funpay-manager = "app:app"

[tool.setuptools]
py-modules = ["app", "models", "config", "scheduler", "backup_manager"]
